apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:adbc77d6c64724994fe35d5f4defc4fb232f87ec

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
