apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:3f703a87a3536ab80197dd0196a70e4a9b9cb569

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
