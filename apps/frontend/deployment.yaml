apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:146073eddc3e5e08d160ee26440e10ad73771ea5

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
