apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:ebe02557048f0e9cb273d7db18d7a72dc7f9cf2f

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
