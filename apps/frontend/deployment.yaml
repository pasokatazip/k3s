apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:83006846ef19affc3113a47e32b9d36ccceb8111

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
