apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:5b82a8fd72802439c4bc5c2dc626cf7a9625762e

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
