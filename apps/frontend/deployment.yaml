apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:c9c0d0aa5164b794d213cc985846010b6e5ea967

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
