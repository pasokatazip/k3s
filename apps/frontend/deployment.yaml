apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:be1412e5876e355f3c128568fe4594c9b4d52619

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
