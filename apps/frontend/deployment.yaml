apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:0f6b08d01f20b4f10c0938449fa43bb9afa8348b

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
