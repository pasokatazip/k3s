apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:29a0066ff79d5938c494ce48f99108dabfa8fc4e

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
