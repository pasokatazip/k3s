apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:392f3f5126fe4e89bb460fa256416bab9314d5f2

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
