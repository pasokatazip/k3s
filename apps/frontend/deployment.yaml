apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:6b155f37c6b8493ededf9f2a1233333d0b4a4aea

          ports:
            - containerPort: 3000

          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://api.akatukii.com"
