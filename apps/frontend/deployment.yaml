apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:dad9d15af85a1aa5a74fe8758cab947cfe3341a7

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
