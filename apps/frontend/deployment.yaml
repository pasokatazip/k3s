apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:3d787ad7ee4a35c79d7d7c9f29ca69d5dbe83b0c

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
