apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:bc6be0943d50f93db0c834d5282e3f9b32d92a5b

          ports:
            - containerPort: 3000

          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://api.akatukii.com"
