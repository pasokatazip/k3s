apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:8a0eef06776280868643aa2ecd67347c3f11448b

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
