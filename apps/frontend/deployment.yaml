apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:dcc5d7064d97e2d6492a2786d97030daf0c73542

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
