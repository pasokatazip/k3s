apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:ef1a0da9dfa9979bc98ec08217206e8421e86b61

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
