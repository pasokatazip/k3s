apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:840eeae0d98cdae1af4d769160a0a9b32513826b

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
