apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:240e193dbe6b0e2e72d8a705955038cdb3afa173

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
