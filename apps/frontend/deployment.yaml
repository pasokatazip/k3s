apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:82591920359768113d0b0688e14f34b41794a7f9

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
