apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:21c131d2d7fd852b5c28c9bb3967e9ed0644e280

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
