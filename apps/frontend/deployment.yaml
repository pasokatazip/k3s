apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:1e6b83dbd7a864ee22a4732a65860bfe14c419fb

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
