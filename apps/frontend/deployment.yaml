apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:a4551df2b3af1113bca540946ac3ac68f1a8ded5

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
