apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:33d4cbfc1d7c74861e2d1fa73c96f92f9074e5fe

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
