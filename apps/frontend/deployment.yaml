apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:64d2ba9198f071ad3fd7136fc53905db8517d0b6

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
