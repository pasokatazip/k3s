apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:
        - name: frontend
          image: ghcr.io/pasokatazip/frontend:ec6fa0a19955056c2833705193b076b92b8d764b

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: frontend-config
