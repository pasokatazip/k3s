apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:fd2c0ca7035f6028cb0b7299f1c2e2c86629a77b

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
