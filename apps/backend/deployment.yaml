apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:578d16a1e33f7bfbbb09f46b7b93026baa43a058

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
