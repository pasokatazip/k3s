apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:13d66d2de0fd8ea3214146305901a51b5f7f9903

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
