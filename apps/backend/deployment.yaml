apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:88eb8f343d803906dd183530fb0d5013d4c14ea0

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
