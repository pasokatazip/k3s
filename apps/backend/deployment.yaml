apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:c2c3c1dfe4849c50bf388273e0ab7f3d5478a9e3

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
