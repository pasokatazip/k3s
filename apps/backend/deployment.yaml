apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:c7b14f8927c52656e4f87c6ff2f97ae922271b7b

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
