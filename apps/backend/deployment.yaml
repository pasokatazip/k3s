apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:cf9df69a0a9af8b918529cbc0f25fd310c6d2a91

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
