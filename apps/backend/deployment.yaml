apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:ff55ba664753e14ef16063c0b2cf0c80bc4aaa77

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
