apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:5b5511f781cd547f93d604e053b9299c9c165a3d

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
