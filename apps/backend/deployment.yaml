apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:dd262659b3d23016cf6eb6a54d38edf19be34b61

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
