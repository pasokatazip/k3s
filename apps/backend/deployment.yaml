apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:3c83f244e72a4022cd588865830e4ea09c247dd8

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
