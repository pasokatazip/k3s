apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:e27db06f13c353f9baf5500b6de3f3c4ef629202

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
