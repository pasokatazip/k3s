apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:dce9785dca0b0029183293fdd6868d3ec9e2d4f6

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
