apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:306f1ef37518b3a3f54fb6a23b015ab18104a822

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
