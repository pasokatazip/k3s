apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:72b08e9c7d4b861f6a529a9a31d55b468e948099

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
