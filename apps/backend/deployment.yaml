apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:8c903eda492e4f178145d1d15a52fd555e8a2e3f

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
