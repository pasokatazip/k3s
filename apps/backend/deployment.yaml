apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:5c270cfabd1e06daa1243bb97fd2bcca89205e13

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
