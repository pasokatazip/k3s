apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:9fc960c36950df3d1d1e8db2d79e1830e1dcf51f

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
