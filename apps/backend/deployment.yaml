apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:50b504684f87a677ef7fe2b53ccc2edb04c3943a

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
