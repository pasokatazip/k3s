apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:88c9e4e7860f9eb1d451f99ce5e1cb7520f3c34a

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
