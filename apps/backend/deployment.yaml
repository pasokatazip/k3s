apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:f3f5ed8a6a734761e894389f2e4db296a4b04eb2

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
