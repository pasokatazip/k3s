apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:2367e7c79f1925d65c4ff4bba390a6d23c47b70e

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
