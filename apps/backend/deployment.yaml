apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      #imagePullSecrets:
        #- name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/pasokatazip/backend:c3f3b0d3f686f4d28d1be43a60f294b4f2730330

          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
