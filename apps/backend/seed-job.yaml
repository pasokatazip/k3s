apiVersion: batch/v1
kind: Job
metadata:
  name: backend-seed
  namespace: app
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/pasokatazip/backend:df024b56ec0bb7dbd531bee228600851d558a472
          command:
            - sh
            - -c
            - |
              for f in seeds/common/*.sql; do
                echo "Applying $f"
                psql "$DATABASE_URL" -f "$f"
              done
          envFrom:
            - secretRef:
                name: backend-secret
