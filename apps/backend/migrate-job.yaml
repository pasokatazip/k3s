apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: app
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/pasokatazip/backend:9fc960c36950df3d1d1e8db2d79e1830e1dcf51f
          command:
            - goose
            - -dir
            - migrations
            - postgres
            - "$(DATABASE_URL)"
            - up
          envFrom:
            - secretRef:
                name: backend-secret
