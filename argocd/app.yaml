apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pasokatazip/k3s.git
    targetRevision: develop
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
